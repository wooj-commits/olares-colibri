name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Version
        id: meta
        run: echo "version=$(awk '/^version:/{print $2; exit}' chart/colibri/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/olares-colibri:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/olares-colibri:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/olares-colibri:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package chart
        run: ./scripts/package-chart.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.meta.outputs.version }}
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" --notes "colibri chart $V, image ghcr.io/${{ github.repository_owner }}/olares-colibri:$V"
          gh release upload "v$V" "dist/colibri-$V.tgz" --clobber
