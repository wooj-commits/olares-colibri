{{- $oe := .Values.olaresEnv | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: colibri-secrets
  namespace: '{{ .Release.Namespace }}'
type: Opaque
stringData:
  {{- if index $oe "COLI_API_KEY" }}
  COLI_API_KEY: {{ index $oe "COLI_API_KEY" | quote }}
  {{- end }}
  {{- if index $oe "HF_TOKEN" }}
  HF_TOKEN: {{ index $oe "HF_TOKEN" | quote }}
  {{- end }}
